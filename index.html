<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English with QnB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QnB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B9A58F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--a:#ff7eb6;--bg:linear-gradient(160deg,#ffe3f0,#fff8fc 55%,#f3ecff);--card:#fff;--ink:#3b1830;--mut:#9a6b87;--line:#f5d6e6;--soft:#fde6f1}
[data-mode=qaulan]{--a:#6fa8dc;--bg:linear-gradient(160deg,#eaf4fc,#f5faff 60%);--card:#ffffff;--ink:#14324f;--mut:#6b8aa6;--line:#d3e4f3;--soft:#e4f0fa}
[data-mode=combined]{--a:#B9A58F;--bg:linear-gradient(160deg,#F8F4EC,#fdfbf7 60%);--card:#fffdf8;--ink:#3b3129;--mut:#7d6e62;--line:#E7DFD2;--soft:#EFE8DC}
[data-mode=combined] .seg .on,[data-mode=combined] .chips .on,[data-mode=combined] #btns .on,[data-mode=combined] .tabs .on,[data-mode=combined] .pri:not(.ghost),[data-mode=combined] .msg,[data-mode=combined] .exrow button,[data-mode=combined] .bell.on{color:#3b3129}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
.wrap{max-width:1000px;margin:auto;padding:14px}
.top{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:space-between;padding:6px 0 10px}
@media(min-width:700px){.top{flex-direction:row}}
.brand{font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--a),#ffb547);-webkit-background-clip:text;background-clip:text;color:transparent}
#date{color:var(--mut);font-size:13px}
.switch{position:relative;width:100%;max-width:380px;background:var(--soft);border-radius:999px;padding:4px}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:var(--a);transition:transform .35s cubic-bezier(.4,1.4,.6,1);box-shadow:0 6px 18px rgba(0,0,0,.18)}
#btns{display:flex;position:relative;z-index:1}
#btns button{flex:1;border:0;background:none;padding:10px 4px;font:700 14px Poppins,system-ui;color:var(--ink);cursor:pointer}
#btns button.on{color:#fff}
[data-mode=qaulan] .seg .on,[data-mode=qaulan] .chips .on,[data-mode=qaulan] #btns .on,[data-mode=qaulan] .tabs .on{color:#0b2540!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.07)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--card),var(--soft))}
.hero h2{margin:0 0 4px;font-size:22px}
.mut{color:var(--mut);font-size:13px}
h3{margin:0 0 10px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr;gap:12px}}
.bar{display:block;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:99px}
.todos{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.todos{grid-template-columns:repeat(4,1fr)}}
.todo{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:16px;padding:10px;cursor:pointer;color:var(--ink);font:600 14px Poppins,system-ui}
.todo.on{border-color:var(--c);background:var(--card)}
.todo .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--c)}
.todo.on .radio{background:var(--c);box-shadow:inset 0 0 0 4px var(--card)}
.todo .bar{grid-column:1/-1}
.tg{font-weight:900}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;margin:6px 0 10px;gap:4px;flex-wrap:wrap}
.seg button,.chips button,.tabs button{border:0;background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:700 13px Poppins,system-ui;cursor:pointer}
.seg button.on,.chips button.on{background:var(--a);color:#fff}
[data-mode=qaulan] .seg .on,[data-mode=qaulan] .chips .on{color:#0b2540}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button{background:var(--soft)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;font:inherit;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer;flex-wrap:wrap}
.genbox{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.genbox small{color:var(--mut)}
.wait{color:var(--mut);font-style:italic;font-size:13px}
.pri{width:100%;margin-top:12px;border:0;border-radius:16px;background:var(--a);color:#fff;padding:13px;font:800 15px Poppins,system-ui;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.pri.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
[data-mode=qaulan] .pri:not(.ghost){color:#0b2540}
.msg{background:var(--a);color:#fff;padding:10px 14px;border-radius:14px;font-weight:700;margin:12px 0}
[data-mode=qaulan] .msg{color:#0b2540}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{font-size:11px;color:var(--mut);text-transform:uppercase;background:var(--soft)}
td input{padding:6px 8px;border-radius:10px;font-size:13px}
.exrow{display:flex;gap:6px}
.exrow button{border:0;background:var(--a);color:#fff;border-radius:10px;padding:6px 10px;font:700 12px Poppins,system-ui;cursor:pointer}
[data-mode=qaulan] .exrow button{color:#0b2540}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--soft);border-radius:18px;padding:12px}
.stat .big{font-size:24px;font-weight:900}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.row2{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#1b1020}
.tabs{position:sticky;top:8px;z-index:9;display:flex;justify-content:center;gap:4px;background:var(--card);border:1px solid var(--line);padding:6px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.12);margin:0 auto 10px;width:fit-content;max-width:100%;overflow-x:auto;white-space:nowrap}
.tabs button.on{background:var(--a);color:#fff}
[data-mode=qaulan] .tabs .on{color:#0b2540}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
body{padding-bottom:0}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--card);overflow-y:auto}
.side .brand{font-size:22px;line-height:1.1}
.switch.vert{max-width:none;display:flex;flex-direction:column}
.switch.vert #btns{flex-direction:column;gap:2px}
.switch.vert #btns button{text-align:left;padding:11px 14px;border-radius:999px}
.switch.vert .thumb{left:4px;right:4px;top:4px;bottom:auto;width:auto;height:calc((100% - 8px)/3);transform:translateY(calc(var(--i,0)*100%))}
.tabs{position:static;transform:none;display:flex;flex-direction:column;gap:4px;background:none;border:0;box-shadow:none;padding:0;margin:0;width:100%;max-width:none;overflow:visible}
.tabs button{text-align:left;width:100%;padding:12px 14px;border-radius:14px;font:600 15px Poppins,system-ui;background:transparent;color:var(--ink)}
.tabs button:hover{background:var(--soft)}
.tabs button.on{background:var(--a);color:#fff}
.content{padding:24px 28px;max-width:1040px;width:100%}
#date{font-size:13px;margin-top:6px}
button[disabled]{opacity:.4;cursor:not-allowed}
.warn{background:#ffe3e8;color:#9b1c33;border:1px solid #ff8fa3;border-radius:14px;padding:12px 14px;font-weight:700;margin:10px 0}
[data-mode=qaulan] .warn{background:#e3f0fb;color:#1d4e7a;border-color:#9cc6ea}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:12px 14px;gap:10px;border-right:0;border-bottom:1px solid var(--line);}
  .side .brand{font-size:18px}
  #date{display:none}
  .switch.vert #btns{flex-direction:row}
  .switch.vert #btns button{text-align:center;padding:9px 4px}
  .switch.vert .thumb{left:4px;top:4px;bottom:4px;right:auto;width:calc((100% - 8px)/3);height:auto;transform:translateX(calc(var(--i,0)*100%))}
  .tabs{flex-direction:row;overflow-x:auto}
  .tabs button{width:auto;white-space:nowrap;padding:9px 14px}
  .content{padding:14px}
}
.hb{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:12px 0}
.hl{font-weight:700;font-size:13px}
.hbars{padding-right:70px}
.hg,.hr{height:12px;border-radius:99px;position:relative;min-width:2px;margin-bottom:5px}
.hg{background:var(--soft)}
.hg span,.hr span{position:absolute;left:100%;margin-left:6px;top:-3px;font-size:11px;white-space:nowrap;color:var(--mut)}
.charts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.charts{grid-template-columns:1fr 1fr}}
.ghostbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;font:700 11px Poppins,system-ui;cursor:pointer;margin-top:6px}
.fixbox{margin-top:8px;background:var(--soft);border-radius:14px;padding:10px;min-width:280px}
.fixbox table{min-width:0}
.fixbox th{font-size:11px;background:transparent}
.fixbox td{font-size:13px;white-space:normal;text-transform:none}
.pvc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.pvt{font-size:16px;margin:4px 0 6px}
.pvr{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-top:1px dashed var(--line)}
.pvr small{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.pvr input{font-size:14px}
.logo{display:flex;gap:12px;align-items:center}
.logo svg{flex:none}
.tagline{font-size:12px;color:var(--mut);margin-top:2px}
.brand{font-family:Poppins,system-ui,sans-serif;font-style:normal;font-weight:800;letter-spacing:0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bell{position:relative;border:0;background:var(--soft);color:var(--ink);width:42px;height:42px;border-radius:999px;display:grid;place-items:center;cursor:pointer;flex:none}
.bell.on{background:var(--a);color:#fff}
[data-mode=qaulan] .bell.on{color:#0b2540}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ff5a7a;color:#fff;font:700 10px/18px Poppins,system-ui,sans-serif;text-align:center;display:none}
.tabs button{display:flex;align-items:center;gap:10px}
.tabs button svg{flex:none}
@media(max-width:760px){
  body{padding-bottom:86px}
  .side .toprow{margin-bottom:2px}
  .side .logo svg{width:34px;height:34px}
  .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-width:none;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);background:var(--card);box-shadow:0 -6px 20px rgba(0,0,0,.06);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));flex-direction:row;justify-content:space-around;gap:4px;overflow:visible;z-index:30}
  .tabs button{flex-direction:column;justify-content:center;gap:3px;width:auto;padding:6px 10px;border-radius:14px;font:600 11px Poppins,system-ui,sans-serif;background:transparent;color:var(--mut)}
  .tabs button.on{background:var(--soft);color:var(--ink);font-weight:700}
  [data-mode=qaulan] .tabs button.on{color:#0b2540}
  .tabs button:hover{background:transparent}
  .tabs button span{white-space:nowrap;font-size:10.5px}
  .tabs button{padding:6px 6px}
}
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 18px}
.welcome h1{font-size:26px;margin:18px 0 6px;max-width:520px}
.welcome h3{margin:26px 0 0;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.modes{display:grid;gap:12px;width:100%;max-width:520px;margin-top:14px}
.mode-card{border:0;border-radius:22px;padding:18px 20px;text-align:left;color:#1b1020;font:inherit;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.10);display:flex;flex-direction:column;gap:4px}
.mode-card b{font-size:20px}
.mode-card span{font-size:13px;opacity:.8}
body.welcome .side,body.welcome .tabs{display:none!important}
body.welcome .shell{grid-template-columns:1fr}
body.welcome .content{padding:0;max-width:none}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:18px;padding:10px 12px}
.acct>div:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--a);color:#1b1020;display:grid;place-items:center;font-weight:800;flex:none}
.avatar.big{width:52px;height:52px;font-size:20px}
.tgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media(min-width:700px){.tgrid{grid-template-columns:1fr 1fr}}
.tcell{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:16px;padding:10px 12px}
.tcell>span{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.tcell input{width:74px;text-align:center;border-radius:12px;padding:8px}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.pilltg-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pilltg{border:1.5px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:7px 13px;font:600 12px Poppins,system-ui,sans-serif;cursor:pointer}
.pilltg.on{background:var(--c);border-color:var(--c);color:#1b1020}
.overlay{position:fixed;inset:0;background:rgba(40,25,35,.35);display:grid;place-items:center;z-index:100;padding:20px}
.sheet{background:var(--card);border-radius:24px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sheet button{width:100%;margin-top:8px}
.dirty{position:sticky;top:8px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.dirty .pri{width:auto;margin:0;padding:8px 14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;z-index:200;max-width:90%;text-align:center;font-size:14px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--a);color:transparent;user-select:none}
body.dark{--bg:linear-gradient(160deg,#1c1822,#15121a 60%);--card:#241f2b;--ink:#f3eef7;--mut:#a79bb4;--line:#3a3145;--soft:#2e2739}
.adot{position:absolute;top:6px;right:16px;width:8px;height:8px;border-radius:50%;background:#ff5a7a}
.tabs button{position:relative}
#rvq{margin:12px 0}
@media(max-width:760px){.tabs{transition:transform .25s ease}.tabs.hide{transform:translateY(150%)}}

.rvsel{width:100%;max-width:360px;margin:4px 0 6px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font:600 13px Poppins,system-ui,sans-serif}
.opts{display:grid;gap:10px;margin-top:16px;text-align:left}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:600 15px Poppins,system-ui,sans-serif;text-align:left}
button.opt{cursor:pointer}
button.opt:hover,button.opt:focus-visible{border-color:var(--a);background:var(--soft);outline:none}
.opt b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);flex:none;font-size:13px}
.opt.right{border-color:#43a86b;background:#e3f5ea;color:#14532d}
.opt.right b{background:#43a86b;color:#fff}
.opt.wrong{border-color:#ff8fa3;background:#ffe3e8;color:#7a1328}
.opt.wrong b{background:#ff5a7a;color:#fff}
.keyhint{font-size:12px;margin-top:10px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:20px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--a);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
@media(max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mbox{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}
.mbox b{display:block;font-size:22px}
.mbox small{color:var(--mut);font-size:12px}
.wrongtxt{color:#c0264a;text-decoration:line-through;text-decoration-thickness:1.5px}
body.dark .wrongtxt{color:#ff8fa3}
.righttxt{font-weight:700;margin:4px 0}
.iconbtn{border:0;background:var(--soft);color:var(--ink);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:15px;vertical-align:middle;margin-left:6px;flex:none}
.iconbtn:hover{background:var(--line)}
.item.mistake{align-items:flex-start;cursor:default}
textarea.rvs{width:100%;font:inherit;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;min-height:84px;margin:10px 0}
.lvpill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink)}
.speak{margin-top:12px;text-align:center}
.speak p{margin-top:8px}
.duelgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.duelgrid .mbox b{font-size:28px;margin:4px 0}
.duelgrid .mbox.win{outline:2px solid var(--a)}
.hist{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 14px;align-items:center;font-size:14px}
.hist .h{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase}
.sres{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.sres:last-child{border-bottom:0}
.aiwrap{margin:10px 0}
.aibox{background:var(--soft);border-radius:14px;padding:12px 14px;text-align:left}
.aibox p{margin:6px 0}
.aibox .ghostbtn{margin:6px 6px 0 0}
.aipanel{background:var(--soft);border-radius:14px;padding:12px 14px;margin:8px 0 14px}
.aipanel .item{border-bottom:1px dashed var(--line)}
.aipanel .item:last-of-type{border-bottom:0}
.pickrow{cursor:pointer;border-radius:10px;padding:9px 8px!important;flex-wrap:nowrap}
.pickrow:hover,.pickrow:focus-visible{background:var(--card);outline:none}
.pickrow.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--a)}
.pickrow.used{opacity:.55;cursor:default}
.okline{color:#2f7d4f;font-weight:600}
body.dark .okline{color:#7fd6a2}
#lookslot{min-height:20px;margin:4px 0 2px;font-size:13px}
#lookslot .ghostbtn{margin:4px 6px 0 0}
.autotag{font-size:11px;font-weight:700;color:var(--a);margin-left:6px;text-transform:none;letter-spacing:0}

const escRe=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function forms(w){
  const lw=String(w).toLowerCase(),set=new Set([lw]);
  (IRR[lw]||[]).forEach(f=>set.add(f));
  const last=lw.slice(-1),cvc=/[^aeiou][aeiou][^aeiouwxy]$/.test(lw);
  set.add(lw+'s');
  if(/(s|x|z|ch|sh|o)$/.test(lw))set.add(lw+'es');
  if(/[^aeiou]y$/.test(lw)){set.add(lw.slice(0,-1)+'ies');set.add(lw.slice(0,-1)+'ied')}
  if(/e$/.test(lw)){set.add(lw.slice(0,-1)+'ing');set.add(lw+'d')}else{set.add(lw+'ing');set.add(lw+'ed')}
  if(cvc){set.add(lw+last+'ing');set.add(lw+last+'ed')}
  return [...set];
}
function kwPattern(kw){
  return String(kw).trim().split(/\s+/).map(t=>'(?:'+forms(t).map(escRe).sort((a,b)=>b.length-a.length).join('|')+')').join('\\s+');
}
function hl(text,kw){
  const t=String(text??''),k=String(kw||'').trim().replace(/\s+/g,' ');
  if(!k)return e(t);
  const re=new RegExp('(?<![A-Za-z])('+kwPattern(k)+')(?![A-Za-z])','gi');
  let out='',last=0,m;
  while((m=re.exec(t))){
    const exact=m[0].replace(/\s+/g,' ').toLowerCase()===k.toLowerCase();
    out+=e(t.slice(last,m.index))+(exact?'<b>'+e(m[0])+'</b>':'<b class="infl" title="a form of: '+e(k)+'">'+e(m[0])+'</b>');
    last=m.index+m[0].length;
  }
  return out+e(t.slice(last));
}

// Called when the Google sign-in has run out (it lasts 1 hour)
function sessionExpired(msg){

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='qnb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const sc=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('timed out'))},25000);
    function cleanup(){clearTimeout(timer);delete window[cb];sc.remove()}
    window[cb]=d=>{cleanup();resolve(d)};
    sc.onerror=()=>{cleanup();reject(new Error('network'))};
    sc.src=API+'?callback='+encodeURIComponent(cb)+'&payload='+encodeURIComponent(JSON.stringify(params));
    document.body.appendChild(sc);
  });
}
// Every change asks the server to send the fresh data back in the same reply (one round trip instead of two)
function afterApi(r){

}
function api(body){

}
// Large data (pictures) goes by POST, because a URL can only hold a few KB
function apiPost(body){
  if(ID_TOKEN&&jwtExp(ID_TOKEN)<Date.now()){sessionExpired();return Promise.resolve({error:'Your session expired. Please sign in again.'})}
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:ID_TOKEN,withState:'1'},body))})
    .then(r=>r.json()).then(afterApi).catch(err=>({error:'Upload failed ('+err.message+'). Try again.'}));
}
// Shrinks a photo to max 1600px JPEG before upload
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85).split(',')[1])};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that image. Try a JPG or PNG.'))};
    img.src=url;
  });
}

function rvCard(key){

function rvOptions(c){

    body=`<div class="${res&&res.ok?'msg':'warn'}">${res?(res.ok?'Correct!':'Not quite. The answer is "'+e(word)+'".'):'The answer is "'+e(word)+'".'}</div><div class="opts">${opts.map((o,i)=>{const right=o.toLowerCase()===word.toLowerCase(),picked=res&&String(res.typed).toLowerCase()===o.toLowerCase();return `<div class="opt ${right?'right':picked?'wrong':''}"><b>${'ABC'[i]}</b><span>${e(o)}</span></div>`}).join('')}</div>${info}${micBlock(ex||word)}`;
  } else if(task==='recall'&&!rv.reveal){
    const canBlank=ex&&hasKw(ex,word);
    body=`<div class="mut">${c.cat==='Grammar'?'Type the grammar name':'Type the missing word'}</div>${canBlank?`<div style="font-size:19px;margin:12px 0;line-height:1.5">${blankIt(ex,word)}</div>`:''}<p style="margin:8px 0"><b>Meaning:</b> ${e(c.meaning)}</p><input id="rvq" placeholder="Type it here, then press Enter" autocomplete="off" autocapitalize="off"><button class="pri" data-a="rv_check">Check</button>`;
  } else if(task==='recall'){
    body=`<div class="${res&&res.ok?'msg':'warn'}">${res?(res.ok?'Correct!':'Not quite'+(res.typed?': you wrote "'+e(res.typed)+'"':'')+'.'):'Here is the answer.'}</div>${big(word)}${info}${micBlock(ex||word)}`;
  } else if(task==='use'&&!rv.reveal){
    body=`<div class="mut">Write your own sentence with</div>${big(word)}<p class="mut" style="margin-top:6px">${e(c.meaning)}</p><textarea id="rvs" class="rvs" placeholder="Your sentence (any form of the word is fine)"></textarea><button class="pri" data-a="rv_use">Check my sentence</button>`;
  } else if(task==='use'){
    const fb=!res?'Here is an example.':res.ok?'Nice! Your sentence uses the word. Read it once more and check the grammar.':(!hasKw(res.typed,word)?'Your sentence needs to include "'+e(word)+'" (any form is fine).':'Make it a full sentence (at least 4 words).');
    body=`<div class="${res&&res.ok?'msg':'warn'}">${fb}</div>${res&&res.typed?`<p style="font-size:18px;margin:10px 0">${hl(res.typed,word)} ${sayBtn(res.typed)}</p>${aiBox('use')}`:''}${big(word)}${info}${micBlock(res&&res.ok?res.typed:(ex||word))}`;
  } else {
    body=`<div class="mut">Recall this</div>${big(word)}${rv.reveal?info+micBlock(ex||word):''}`;
  }
  let actions;
  if(!rv.reveal){
    if(task==='fix')actions='<button class="pri" data-a="rv_reveal" style="margin-top:14px">Show the correct version</button>';
    else if(task==='card')actions='<button class="pri" data-a="rv_reveal" style="margin-top:14px">Show meaning</button>';
    else actions=`<button class="ghostbtn" data-a="rv_reveal" style="margin-top:12px">${task==='use'?'Skip, show me an example':'Show answer'}</button>`;
  }
  else if(res)actions=`<button class="pri" data-a="${res.ok?'rv_ok':'rv_no'}" style="margin-top:14px">Next card</button><p class="mut" style="text-align:center;margin:8px 0 0">${res.ok?(lv>=3?'Great, this word moves up.':'Counted as remembered.'):'This word comes back tomorrow.'}</p>`;
  else actions=`<div class="row2" style="margin-top:14px"><button class="pri" data-a="rv_ok">Remembered</button><button class="pri ghost" data-a="rv_no">Need practice</button></div><p class="mut" style="text-align:center;margin:8px 0 0">or swipe right / left</p>`;
  const star=task==='fix'?'<span></span>':`<button class="ghostbtn" data-a="rv_fav" data-w="${e(word.toLowerCase())}">${isFav?'Saved':'Save word'}</button>`;
  const lvPill=lv&&smart?`<span class="lvpill">${LEVEL_NAME[lv]}</span>`:'';
  return head+`<div class="card" id="rvcard"><div class="row2" style="justify-content:space-between"><b>Card ${rv.i+1} of ${total}</b><span class="row2" style="gap:6px">${lvPill}<span class="pill" style="background:${COL[c.cat]||'var(--soft)'}">${e(c.cat)}</span></span></div><div class="bar" style="margin:12px 0"><i style="width:${Math.round(rv.i/total*100)}%"></i></div><div style="text-align:center;padding:14px 6px">${body}</div>${actions}</div><div class="card row2" style="justify-content:space-between">${star}<small class="mut">Remembered ${rv.ok.length} · Need practice ${rv.no.length}</small><button class="ghostbtn" data-a="rv_new">New 20</button></div>`;
}

// ---------- weekly duel ----------
const partnerOf=u=>u==='bella'?'qaulan':'bella';
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return t.getUTCFullYear()+'-W'+String(isoWeek(d)).padStart(2,'0')}
const duelRec=(wk,u)=>DUELS.find(x=>x.week===wk&&x.player===NAME[u]);
const duelPending=()=>!duelRec(weekKey(TODAY),S.by);
const fmtSec=n=>{n=Math.round(Number(n)||0);return n>=60?Math.floor(n/60)+'m '+(n%60)+'s':n+'s'};
function duelWinner(a,b){if(!a||!b)return null;if(a.score!==b.score)return a.score>b.score?a:b;if(Number(a.seconds)!==Number(b.seconds))return Number(a.seconds)<Number(b.seconds)?a:b;return 'tie'}
function duelOpts(c,pool){
  const seen=new Set([c.word.toLowerCase()]);
  const take=(list,n)=>{const out=[];for(const x of shuffle(list.slice())){if(out.length>=n)break;const k=String(x.word||'').toLowerCase();if(!k||seen.has(k))continue;seen.add(k);out.push(x.word)}return out};
  let d=take(pool.filter(x=>x.cat===c.cat),2);
  if(d.length<2)d=d.concat(take(BANK.filter(b=>b.c===c.cat).map(b=>({word:b.w})),2-d.length));
  if(d.length<2)d=d.concat(take(pool,2-d.length));
  return shuffle([c.word,...d]);
}
// 10 questions from your partner's words: this week's first, then older ones, then the Words Bank if needed
function buildDuel(){
  const mate=partnerOf(S.by);
  const theirs=ENTRIES.filter(x=>x.u===mate&&REVIEW_CATS.includes(x.c)&&rvWordOf(x)).map(x=>({c:rvCard(x.id),d:x.d})).filter(x=>x.c);
  const order=[...shuffle(theirs.filter(x=>x.d>=MON)),...shuffle(theirs.filter(x=>x.d<MON))].map(x=>x.c);
  const seen=new Set(),picked=[];
  order.forEach(c=>{const k=c.word.toLowerCase();if(picked.length<10&&!seen.has(k)){seen.add(k);picked.push(c)}});
  let fromBank=0;
  if(picked.length<10)shuffle(BANK.map((b,i)=>b&&b.w&&REVIEW_CATS.includes(b.c)?i:-1).filter(i=>i>=0)).forEach(i=>{if(picked.length>=10)return;const c=rvCard('b:'+i);const k=c.word.toLowerCase();if(!seen.has(k)){seen.add(k);picked.push(c);fromBank++}});
  const pool=theirs.map(x=>x.c);
  const qs=picked.map(c=>{const blank=c.ex&&hasKw(c.ex,c.word);return {word:c.word,cat:c.cat,ex:c.ex,meaning:c.meaning,
    label:blank?'Pick the missing word':c.cat==='Grammar'?'Which grammar matches this rule?':'Which word means this?',
    prompt:blank?blankIt(c.ex,c.word):e(c.meaning),opts:duelOpts(c,pool)}});
  S.duel={qs:qs,i:0,score:0,picked:null,log:[],t0:Date.now(),done:false,fromBank:fromBank};
}
function finishDuel(){
  const D=S.duel;D.done=true;D.seconds=Math.round((Date.now()-D.t0)/1000);
  const rec={week:weekKey(TODAY),player:NAME[S.by],score:D.score,total:D.qs.length,seconds:D.seconds,date:TODAYS};
  if(REMOTE){S.msg='Saving your score…';render();api(Object.assign({action:'saveDuel'},rec)).then(r=>{S.msg=r.error||'Score saved. '+NAME[partnerOf(S.by)]+' gets a notification.';render()});return true}
  DUELS.push(rec);S.msg='Score saved.';return false;
}
function duelScreen(){
  const wk=weekKey(TODAY),me=S.by,mate=partnerOf(me),D=S.duel;
  if(D&&!D.done&&D.qs.length){
    const q=D.qs[D.i],ans=D.picked;
    const opts=q.opts.map((o,i)=>{
      if(ans===null)return `<button class="opt" data-a="duelPick" data-v="${e(o)}"><b>${'ABC'[i]}</b><span>${e(o)}</span></button>`;
      const right=o.toLowerCase()===q.word.toLowerCase(),picked=ans.toLowerCase()===o.toLowerCase();
      return `<div class="opt ${right?'right':picked?'wrong':''}"><b>${'ABC'[i]}</b><span>${e(o)}</span></div>`}).join('');
    const after=ans===null?'<p class="mut keyhint">Tip: press A, B or C on your keyboard. The clock is running!</p>'
      :`${q.ex?`<p style="margin-top:12px">${hl(q.ex,q.word)} ${sayBtn(q.ex)}</p>`:''}<button class="pri" data-a="duelNext" style="margin-top:14px">${D.i+1<D.qs.length?'Next question':'See my score'}</button>`;
    return `<div class="card"><div class="row2" style="justify-content:space-between"><b>Question ${D.i+1} of ${D.qs.length}</b><span class="row2" style="gap:6px"><span class="lvpill">Score ${D.score}</span><span class="pill" style="background:${COL[q.cat]||'var(--soft)'}">${e(q.cat)}</span></span></div><div class="bar" style="margin:12px 0"><i style="width:${Math.round(D.i/D.qs.length*100)}%"></i></div><div style="text-align:center;padding:10px 6px"><div class="mut">${q.label}</div><div style="font-size:19px;margin:12px 0;line-height:1.5">${q.prompt}</div><div class="opts">${opts}</div>${after}</div></div>`;
  }
  const mine=duelRec(wk,me),theirs=duelRec(wk,mate),w=duelWinner(mine,theirs);
  const verdict=!mine?'':!theirs?`Waiting for ${NAME[mate]} to play.`:w==='tie'?"It's a tie! 🤝":w===mine?'You win this week! 🏆':`${NAME[mate]} wins this week. Next week is yours!`;
  const box=u=>{const r=duelRec(wk,u);return `<div class="mbox ${w&&w!=='tie'&&r===w?'win':''}"><small>${NAME[u]}</small><b>${r?r.score+'/'+r.total:'–'}</b><small>${r?fmtSec(r.seconds):'Not played yet'}</small></div>`};
  const theirN=ENTRIES.filter(x=>x.u===mate&&REVIEW_CATS.includes(x.c)).length;
  const main=`<div class="card"><h3>Weekly duel · Week ${isoWeek(TODAY)}</h3><p class="mut">10 questions built from ${NAME[mate]}'s words. Higher score wins; if it's a tie, the faster one wins. One try per week, a new duel starts every Monday.</p><div class="duelgrid">${box(me)}${box(mate)}</div>${verdict?`<div class="msg" style="text-align:center">${verdict}</div>`:''}${!mine?`<button class="pri" data-a="duelStart">Start the duel</button>${theirN<10?`<p class="mut" style="margin-top:8px">${NAME[mate]} has ${theirN} word${theirN===1?'':'s'} so far, so the rest come from the Words Bank.</p>`:''}`:''}</div>`;
  const review=D&&D.done?`<div class="card"><h3>Your answers</h3>${D.log.map(x=>`<div class="sres"><span>${x.ok?'✅':'❌'}</span><div><b>${e(x.word)}</b>${x.ok?'':` <small class="mut">· you picked “${e(x.picked)}”</small>`}</div></div>`).join('')}</div>`:'';
  return main+review+duelHistory();
}
function duelHistory(){
  const weeks=[...new Set(DUELS.map(x=>x.week))].sort().reverse();
  if(!weeks.length)return '';
  const wins={bella:0,qaulan:0};
  const rows=weeks.map(wk=>{const b=duelRec(wk,'bella'),q=duelRec(wk,'qaulan'),w=duelWinner(b,q);
    if(w&&w!=='tie')wins[w===b?'bella':'qaulan']++;
    return `<span>${e(wk.replace(/^\d{4}-W0?/,'Week '))}</span><span>${b?b.score+'/'+b.total:'–'}</span><span>${q?q.score+'/'+q.total:'–'}</span><span>${!w?'…':w==='tie'?'Tie':w===b?'🏆 Bella':'🏆 Qaulan'}</span>`}).join('');
  return `<div class="card"><div class="row2" style="justify-content:space-between"><h3>Duel history</h3><b>Bella ${wins.bella} · Qaulan ${wins.qaulan}</b></div><div class="hist"><span class="h">Week</span><span class="h">Bella</span><span class="h">Qaulan</span><span class="h">Winner</span>${rows}</div></div>`;
}

const AI_ON=()=>!!(REMOTE&&REMOTE.aiOn);
function aiFormKey(){return S.cat==='Movie'?'review':S.cat==='Analyze Data'?ownKey('Analyze Data',S.by):ownKey(S.cat,S.by)}
function aiBox(where){

function runAiCheck(where){

// ---------- Own finding: auto-fill meaning (Words Bank first, then AI) ----------
const AUTO_KEYS=['meaning','cat','ung'];
function fillWordFields(x,setWord){
  const C=CATS[S.cat],keys=C.f.map(f=>f[0]);
  const set=(k,v)=>{if(!keys.includes(k)||v==null)return;S.f[k]=v;const el=document.querySelector(`[data-f="${k}"]`);if(el)el.value=v;};
  if(setWord)set(C.gsrc,x.word);
  set('meaning',x.meaning||'');
  if(S.cat==='Vocabulary')set('cat',x.pos||'');
  if(S.cat==='Expression')set('ung',x.ung||'');
  syncDup();
}
function lookHtml(){
  const C=CATS[S.cat],w=String(S.f[C.gsrc]||'').trim(),L=S.look&&S.look.w===w?S.look:null;
  const left=L&&L.left!=null?` <span class="mut">· ${L.left} AI word helps left today</span>`:'';
  const what=S.cat==='Expression'?'Ungkapan and Ekspresi':'meaning';
  if(!w||!L)return `<small class="mut">${AI_ON()?'Type it, then press Enter or Tab. The '+what+' fill'+(S.cat==='Expression'?'':'s')+' in by itself.':'If it is in the Words Bank, the meaning fills in by itself.'}</small>`;
  if(L.st==='loading')return `<small class="mut">✨ Filling in the ${what}…</small>`;
  if(L.st==='bank')return '<small class="okline">✓ Meaning filled from the Words Bank. Edit it if you like.</small>';
  if(L.st==='ai')return `<small><span class="okline">✨ ${S.cat==='Expression'?'Ungkapan and Ekspresi':'Meaning'} filled by AI. Check and edit if needed.</span>${left}</small>`;
  if(L.st==='off')return '<small class="mut">Not in the Words Bank. Type the meaning yourself.</small>';
  if(L.st==='suggest')return `<small>Did you mean <b>${e(L.sug)}</b>?</small><br><button class="ghostbtn" data-a="lookUse">Use “${e(L.sug)}”</button><button class="ghostbtn" data-a="lookKeep">Keep “${e(w)}”</button>`;
  if(L.st==='err')return `<small class="mut">${e(L.msg)}</small><br><button class="ghostbtn" data-a="lookRetry">Try again</button>`;
  return '';
}
function setLook(o){S.look=o;const sl=document.getElementById('lookslot');if(sl)sl.innerHTML=lookHtml();}
function refreshTags(){document.querySelectorAll('[data-f]').forEach(el=>{const lab=el.previousElementSibling;if(!lab||lab.tagName!=='LABEL')return;const t=lab.querySelector('.autotag');const want=S.autoFill&&AUTO_KEYS.includes(el.dataset.f)&&String(el.value||'').trim();if(want&&!t)lab.insertAdjacentHTML('beforeend','<span class="autotag">auto-filled</span>');if(!want&&t)t.remove();});}
function ownLookup(force){
  const C=CATS[S.cat];if(!C.bank.length||(S.src!=='own'&&S.cat!=='Expression'))return;
  const w=String(S.f[C.gsrc]||'').trim();
  if(!w){setLook(null);return}
  if(!force&&S.look&&S.look.w===w&&S.look.st!=='err')return;
  if(!force&&String(S.f.meaning||'').trim()&&!S.autoFill)return;   // you typed your own meaning: leave it
  const hit=BANK.find(b=>b.w===w.toLowerCase()&&C.bank.includes(b.c));
  if(hit&&!(S.cat==='Expression'&&AI_ON())){fillWordFields(S.cat==='Expression'?{meaning:'',ung:hit.m}:{meaning:hit.m,pos:hit.pos||'',ung:''});S.autoFill=true;setLook({st:'bank',w:w});refreshTags();return}
  if(!AI_ON()){setLook({st:'off',w:w});return}
  setLook({st:'loading',w:w});
  const cat=S.cat,src=S.src,before=String(S.f.meaning||'');
  api({action:'aiLookup',cat:cat,word:w}).then(r=>{
    if(S.cat!==cat||S.src!==src||String(S.f[C.gsrc]||'').trim()!==w)return;   // you changed the word meanwhile
    if(r.error){setLook({st:'err',w:w,msg:r.error});return}
    const x=r.result;
    if(!x.valid&&x.suggestion&&x.suggestion.toLowerCase()!==w.toLowerCase()){setLook({st:'suggest',w:w,sug:x.suggestion,res:x,left:r.left});return}
    if(String(S.f.meaning||'')!==before)x=Object.assign({},x,{meaning:S.f.meaning});   // you typed a meaning while waiting: keep yours
    fillWordFields(x,false);S.autoFill=true;setLook({st:'ai',w:w,left:r.left});refreshTags();
  });
}

// ---------- streak, weekly summary, export ----------
function dayDone(u,d){
  const cats=SCHED[DNAME[new Date(d+'T12:00:00').getDay()]]||[];
  const goal=cats.reduce((a,c)=>a+(TGT[c]||0),0);
  if(!goal)return null;
  const got=cats.reduce((a,c)=>a+Math.min(TGT[c]||0,ENTRIES.filter(x=>x.u===u&&x.c===c&&(x.sd||x.d)===d).length),0);
  return got>=goal;
}
function streakOf(u){
  let n=0;
  for(let i=0;i<365;i++){
    const dt=new Date(TODAY);dt.setDate(dt.getDate()-i);
    const r=dayDone(u,ds(dt));
    if(r===null)continue;
    if(r)n++;else{if(i===0)continue;break}
  }
  return n;
}
function weekStats(){
  const us=users();
  const entries=ENTRIES.filter(x=>us.includes(x.u)&&x.d>=MON&&x.d<=TODAYS).length;
  let answers=0;
  us.forEach(u=>{answers+=ENTRIES.filter(x=>x.u!==u&&x.u!=='prompt'&&x.d>=MON&&x.d<=TODAYS&&String(x.v[ownKey(x.c,u)]||'').trim()).length});
  const remembered=Object.values(srsGet()).filter(r=>r.lastOk&&r.last>=MON&&r.last<=TODAYS).length;
  let worst=null;
  CAT_ORDER.forEach(c=>{
    const goal=DAYS_SO_FAR(c)*TGT[c]*us.length;if(!goal)return;
    const got=us.reduce((a,u)=>a+subsN(u,c,'week'),0);
    const p=pct(got,goal);
    if(!worst||p<worst.p)worst={c:c,p:p};
  });
  return {entries,answers,remembered,worst};
}
function weekCard(){
  const w=weekStats();
  return `<div class="card"><h3>This week</h3><div class="grid4"><div class="stat"><div class="mut">Entries</div><div class="big">${w.entries}</div></div><div class="stat"><div class="mut">Answers given</div><div class="big">${w.answers}</div></div><div class="stat"><div class="mut">Words remembered</div><div class="big">${w.remembered}</div></div><div class="stat"><div class="mut">Behind most</div><div class="big" style="font-size:15px">${w.worst?e(w.worst.c)+' · '+w.worst.p+'%':'—'}</div></div></div></div>`;
}

function exportCsv(){
  const cols=['category','date','by','word','meaning','rules','when','qEx','bEx','title','review','qA','bA'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';

      if(k==='category')return q(x.c);

      return q(x.v[k]||'');
    }).join(','));

  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});

function dupKey(c){const C=CATS[c];return C.gsrc||(C.f.find(x=>x[2]==='in')||[])[0]}
function dupFor(c,f){const k=dupKey(c);if(!k)return null;const v=String(f[k]||'').trim().toLowerCase();if(!v)return null;return ENTRIES.find(x=>x.c===c&&String(x.v[k]||'').trim().toLowerCase()===v)||null}
function syncDup(){const d=dupFor(S.cat,S.f);const sl=document.getElementById('dupslot');if(sl)sl.innerHTML=d?`<div class="warn">${e(dupMsg(d))}</div>`:'';const b=document.getElementById('subbtn');if(b)b.disabled=!!d;}
function dupMsg(x){return `"${x.v[dupKey(x.c)]}" is already in the ${x.c} log, added by ${NAME[x.u]||'the daily prompt'} on ${x.d===TODAYS?'today':x.d}. Please choose another word.`}
function pickBank(v){if(S.cat==='Expression'){const hit=BANK.find(b=>b.w===v);S.f.word=v;S.f.ung=hit?hit.m:'';S.f.meaning='';S.autoFill=true;S.look=null;S.msg='';setTimeout(()=>ownLookup(true),0);return}const hit=BANK.find(b=>b.w===v);S.f[CATS[S.cat].gsrc]=v;if(hit){S.f.meaning=hit.m;S.f.cat=hit.pos||'';}S.msg='';}
function doSubmit(){
  const C=CATS[S.cat],by=S.by;
  if(REMOTE){
    const values={};
    C.f.forEach(([k,,kind])=>{if(kind!=='auto'&&S.f[k]!==undefined)values[k]=String(S.f[k]).trim()});
    const payload=S.cat==='Analyze Data'?{action:'analysis',text:values[ownKey(S.cat,by)]||'',lateDay:S.lateDay||''}:{action:'submit',cat:S.cat,values:values,lateDay:S.lateDay};
    const tempId=Date.now();
    if(S.cat==='Analyze Data'&&!picOf(promptRow(S.lateDay||TODAYS))){S.msg=S.lateDay?'Upload the picture for that day first.':"Upload today's picture first.";return}
    if(S.cat==='Analyze Data'&&!String(values[ownKey(S.cat,by)]||'').trim()){S.msg='Write your analysis first.';return}
    if(S.cat!=='Analyze Data'){ENTRIES.push({id:tempId,d:TODAYS,u:by,c:S.cat,v:Object.assign({},values),row:null,pending:true,sd:S.lateDay||undefined})}
    S.f={};S.lateDay=null;S.msg='Saving…';render();
    api(payload).then(r=>{
      if(r.error){ENTRIES.splice(ENTRIES.findIndex(x=>x.id===tempId),1);S.msg=r.error;render();return}
      S.msg=S.cat==='Analyze Data'?'Analysis saved.':'Saved. Your partner can now answer.';
      render();
    });
    return;
  }
    if(S.cat==='Analyze Data'){const p=promptRow(S.lateDay||TODAYS),k=ownKey(S.cat,by),txt=String(S.f[k]||'').trim();if(!picOf(p)){S.msg='Upload the picture first';return}if(!txt){S.msg='Write your analysis first';return}p.v[k]=txt;note(NAME[by]+' saved today\'s analysis',by==='bella'?'qaulan':'bella');S.f={};S.lateDay=null;S.msg='Analysis saved. Your partner can read it in the log.';return}
  const ins=C.f.filter(x=>x[2]==='in').map(x=>x[0]);
  if(ins.some(k=>!String(S.f[k]||'').trim())){S.msg='Fill every field first';return}
  const ok=ownKey(S.cat,by);
  if(!String(S.f[ok]||'').trim()){S.msg='Write your example before submitting';return}
    const dupE=dupFor(S.cat,S.f);if(dupE){S.msg=dupMsg(dupE);return}
  const v={};
  C.f.forEach(([k,,kind])=>{
    if(kind==='in')v[k]=String(S.f[k]).trim();
    else if(kind==='gen')v[k]=S.gen[k];
    else if(kind==='ex'||kind==='own')v[k]=ownerOf(k)===by?String(S.f[k]).trim():'';
  });
  ENTRIES.push({id:Date.now(),d:TODAYS,u:by,c:S.cat,v,sd:S.lateDay||undefined});note(NAME[by]+' submitted '+(v[C.gsrc]||v.title||'an entry')+' in '+S.cat,by==='bella'?'qaulan':'bella');
  S.f={};S.gen=null;S.lateDay=null;S.msg='Saved. Your partner can now answer the empty box.';
}

  else if(a==='cat'){S.screen='input';S.cat=v;S.f={};S.gen=null;S.msg='';}
  else if(a==='goanswer'){S.screen='input';S.inTab='answer';S.msg='';}
  else if(a==='todo'){S.ai=null;S.cat=v;S.f={};S.gen=null;S.msg='';S.lateDay=null;}
  else if(a==='by'){if(!REMOTE)S.by=v;S.msg='';}
  else if(a==='src'){S.src=v;S.gen=null;S.f={};S.look=null;S.autoFill=false;}
  else if(a==='pick'){pickBank(v);}
  else if(a==='submit'){doSubmit();}
  else if(a==='dash'){S.dash=v;}
  else if(a==='dv'){S.dv=v;}
  else if(a==='dview'){S.dview=v;}
  else if(a==='markread'){markAllRead();S.msg='All notifications marked as read.';}
  else if(a==='rv_src'){S.rvSrc=v;S.rvCat='All';S.rvTopic='All';startReview();}
  else if(a==='rv_cat'){S.rvCat=v;S.rvTopic='All';startReview();}
  else if(a==='rv_favonly'){S.rvFav=!S.rvFav;startReview();}
  else if(a==='rv_mode'){S.rvMode=v;S.heard=null;if(S.rv){S.rv.reveal=false;S.rv.checked=null}}
  else if(a==='rv_reveal'){S.rv.reveal=true;S.rv.checked=null;S.heard=null;}
  else if(a==='accent'){localStorage.setItem('qnb_accent',v);sayIt(v==='en-GB'?'Hello, this is the British voice.':'Hello, this is the American voice.');}
  else if(a==='rv_use'){const c=rvCard(S.rv.cards[S.rv.i]);const txt=((document.getElementById('rvs')||{}).value||'').trim();
    if(!txt){S.msg='Write a sentence first.';}else if(c){S.rv.checked={ok:hasKw(txt,c.word)&&txt.split(/\s+/).length>=4,typed:txt};S.rv.reveal=true;}}
  else if(a==='addMistake'){const m=S.mf||{},w=(m.mw||'').trim(),r=(m.mr||'').trim(),y=(m.my||'').trim();
    if(!w||!r){S.msg='Fill in both the wrong and the correct sentence.';}
    else if(REMOTE){S.msg='Saving…';render();api({action:'addMistake',wrong:w,right:r,why:y}).then(res=>{if(!res.error)S.mf={};S.msg=res.error||'Mistake saved.';render()});return;}
    else{MISTAKES.push({row:Date.now(),date:TODAYS,by:NAME[S.by],wrong:w,right:r,why:y});S.mf={};S.msg='Mistake saved.';}}
  else if(a==='delMistake'){if(!confirm('Delete this mistake?'))return;
    if(REMOTE){S.msg='Deleting…';render();api({action:'deleteMistake',row:id}).then(r=>{S.msg=r.error||'Mistake deleted.';render()});return;}
    const i=MISTAKES.findIndex(m=>m.row===id);if(i>=0)MISTAKES.splice(i,1);}
  else if(a==='aiCheck'){runAiCheck(t.dataset.w);return}
  else if(a==='aiUse'){if(S.ai&&S.ai.res&&S.ai.where.indexOf('dr:')===0){S.dr=S.dr||{};S.dr[S.ai.where.slice(3)]=S.ai.res.better;S.ai=null;S.msg='Updated. Read it once more, then save.';}
  else if(S.ai&&S.ai.res){S.f[aiFormKey()]=S.ai.res.better;S.ai=null;S.msg='Updated. Read it once more, then submit.';}}
  else if(a==='aiPicks'){loadAiPicks();return}
  else if(a==='aipick'){const P=(S.picks||{})[S.cat],x=P&&P.words&&P.words[+t.dataset.i];
    if(x){if(ENTRIES.some(en=>en.c===S.cat&&String(en.v.word||'').trim().toLowerCase()===x.word.toLowerCase())){S.msg='"'+x.word+'" is already in your log.';}
    else{const own=ownKey(S.cat,S.by);S.f={};S.f[CATS[S.cat].gsrc]=x.word;S.f.meaning=x.meaning;if(S.cat==='Vocabulary')S.f.cat=x.pos;if(S.cat==='Expression')S.f.ung=x.ung;S.autoFill=true;S.msg='';S.ai=null;
      render();const el=document.querySelector(`[data-f="${own}"]`);if(el){el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}return}}}
  else if(a==='lookRetry'){ownLookup(true);return}
  else if(a==='lookUse'){const C=CATS[S.cat];if(S.look&&S.look.sug){S.f[C.gsrc]=S.look.sug;const el=document.querySelector(`[data-f="${C.gsrc}"]`);if(el)el.value=S.look.sug;syncDup();ownLookup(true);}return}
  else if(a==='lookKeep'){if(S.look&&S.look.res){fillWordFields(S.look.res,false);S.autoFill=true;setLook({st:'ai',w:S.look.w,left:S.look.left});refreshTags();}return}
  else if(a==='prtab'){S.prTab=v;S.msg='';}
  else if(a==='goreview'){S.screen='review';S.prTab='review';}
  else if(a==='goduel'){S.screen='review';S.prTab='duel';}
  else if(a==='duelStart'){if(duelRec(weekKey(TODAY),S.by)){S.msg="You already played this week's duel.";}else buildDuel();}
  else if(a==='duelPick'){const D=S.duel;if(D&&D.picked===null){const q=D.qs[D.i],ok=String(v).toLowerCase()===q.word.toLowerCase();D.picked=String(v);if(ok)D.score++;D.log.push({word:q.word,ok:ok,picked:String(v)});}}
  else if(a==='duelNext'){const D=S.duel;if(D){D.i++;D.picked=null;if(D.i>=D.qs.length&&finishDuel())return;}}
  else if(a==='lqclear'){S.lq='';}
  else if(a==='practiceMistakes'){S.prTab='review';S.screen='review';S.rvSrc='mistakes';S.rvCat='All';startReview();}
  else if(a==='rv_pick'){const c=rvCard(S.rv.cards[S.rv.i]);if(c){S.rv.checked={ok:String(v).toLowerCase()===c.word.toLowerCase(),typed:v};S.rv.reveal=true;}}
  else if(a==='rv_check'){const c=rvCard(S.rv.cards[S.rv.i]);const typed=(document.getElementById('rvq')||{value:''}).value;if(c){S.rv.checked={ok:quizOk(typed,c.word),typed:typed.trim()};S.rv.reveal=true;}}
  else if(a==='rv_ok'||a==='rv_no'){rvAnswer(a==='rv_ok')}
  else if(a==='rv_fav'){const f=favGet(),w=t.dataset.w;favSet(f.includes(w)?f.filter(x=>x!==w):[...f,w]);}
  else if(a==='rv_new'){startReview();}
  else if(a==='rv_missed'){startReview(S.rv.no.slice());}
  else if(a==='csv'){exportCsv();S.msg='CSV downloaded.';}
  else if(a==='darkmode'){localStorage.setItem('qnb_dark',localStorage.getItem('qnb_dark')==='1'?'0':'1');S.msg='Appearance changed.';}
  else if(a==='sday'){ensureDraft();const d=t.dataset.d,c=t.dataset.c;const on=S.dS[d].includes(c);if(!on&&S.dS[d].length>=5){S.msg='A day can have up to 5 categories. Remove one first.';}else{S.dS[d]=CAT_ORDER.filter(x=>x===c?!on:S.dS[d].includes(x));}}
  else if(a==='resetsettings'){ensureDraft();S.dS=JSON.parse(JSON.stringify(DEF_SCHED));S.dT=JSON.parse(JSON.stringify(DEF_TGT));S.dA=JSON.parse(JSON.stringify(DEF_ANS));S.msg='Defaults loaded. Save changes to apply them.';}
  else if(a==='choose'){S.wantMode=v;S.signing=true;S.msg='';}
  else if(a==='backwelcome'){S.signing=false;S.msg='';}
  else if(a==='googlesignin'){startGoogleLogin();return;}
  else if(a==='remote_answer'){const w=REMOTE.waiting[+t.dataset.i];const elId=t.dataset.el;const el=document.getElementById(elId);const txt=el?el.value.trim():'';if(!txt){S.msg='Write your answer first.';}else{S.msg='Saving…';api({action:'answer',cat:w.cat,row:w.row,text:txt}).then(r=>{if(!r.error){delete (S.dr||{})[elId];if(S.ai&&S.ai.where==='dr:'+elId)S.ai=null;}S.msg=r.error||'Answer saved.';render()});}}
  else if(a==='switch'){S.started=false;S.signing=false;ID_TOKEN=null;REMOTE=null;localStorage.removeItem('qnb_session');}
  else if(a==='fulltbl'){S.fullTbl=!S.fullTbl;}
  else if(a==='late'){S.cat=t.dataset.c;S.lateDay=t.dataset.d;S.f={};S.gen=null;S.msg='';S.screen='input';S.inTab='today';}
  else if(a==='intab'){S.inTab=v;S.msg='';}
  else if(a==='backtoday'){S.lateDay=null;S.f={};S.gen=null;}
  else if(a==='day'){S.day=v;S.f={};S.gen=null;}
  else if(a==='logcat'){S.logCat=v;S.lq='';S.fullTbl=false;}
  else if(a==='startEdit'){S.editId=id;}
  else if(a==='cancelEdit'){S.editId=null;}
  else if(a==='editAns'){S.editAns=id+'|'+t.dataset.k;S.editId=null;}
  else if(a==='cancelAns'){S.editAns=null;S.ai=null;S.dr={};}
  else if(a==='saveAns'){const en=ENTRIES.find(x=>x.id===id);const val=(document.getElementById('ea'+id)||{value:''}).value.trim();
    if(!en||!val){S.msg='Write your answer first.';}
    else{S.editAns=null;S.msg='Saving…';render();api({action:'answer',cat:en.c,row:en.row,text:val,replace:'1'}).then(r=>{if(!r.error){delete (S.dr||{})['ea'+id];S.ai=null;}S.msg=r.error||'Answer updated.';render()});return;}}
  else if(a==='savEdit'){const en=ENTRIES.find(x=>x.id===id);if(en){const values={};CATS[en.c].f.forEach(([k,,kind])=>{if(kind!=='auto'&&(!/^[qb](Ex|J|A)$/.test(k)||k===ownKey(en.c,S.by))){const el=document.getElementById('ed_'+k);if(el)values[k]=el.value.trim()}});S.editId=null;S.msg='Saving…';render();api({action:'edit',cat:en.c,row:en.row,values:values}).then(r=>{S.msg=r.error||'Changes saved.';render()});return;}}
  else if(a==='delEntry'){const en=ENTRIES.find(x=>x.id===id);if(en&&confirm('Delete this entry? This cannot be undone.')){S.msg='Deleting…';render();api({action:'delete',cat:en.c,row:en.row}).then(r=>{S.msg=r.error||'Entry deleted.';render()});return;}}
  else if(a==='refresh'){S.msg='Refreshing…';loadState(true).then(ok=>{S.msg=ok?'Up to date.':S.msg;render()});return;}
  else if(a==='ans'&&REMOTE){const en=ENTRIES.find(x=>x.id===id);const val=(document.getElementById('a'+id)||{value:''}).value.trim();if(!en||!val){S.msg='Write your answer first.';}else{S.msg='Saving…';render();api({action:'answer',cat:en.c,row:en.row,text:val}).then(r=>{if(!r.error){delete (S.dr||{})['a'+id];S.ai=null;}S.msg=r.error||'Answer saved.';render()});return;}}
  else if(a==='ans'){const id=+t.dataset.id,k=t.dataset.k;const val=(document.getElementById('a'+id)||{value:''}).value.trim();const en=ENTRIES.find(x=>x.id===id);if(en&&val){en.v[k]=val;note(NAME[S.by]+' answered an entry in '+en.c,en.u);S.msg='Answer saved ';}}
  render();
});
document.addEventListener('input',ev=>{
  const k=ev.target.dataset&&ev.target.dataset.f;
  if(k){S.f[k]=ev.target.value;syncDup();
    if(CATS[S.cat]&&k===CATS[S.cat].gsrc&&S.look&&S.look.w!==ev.target.value.trim()&&S.look.st!=='loading')setLook(null);
    if(AUTO_KEYS.includes(k)&&S.autoFill&&ev.target.dataset.f==='meaning'){S.autoFill=false;refreshTags();}
   if(S.ai&&S.ai.where==='form'&&!S.ai.loading&&k===aiFormKey())S.ai=null;}
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&CATS[S.cat]&&ev.target.dataset.f===CATS[S.cat].gsrc&&S.src==='own'&&S.screen==='input'){S.f[ev.target.dataset.f]=ev.target.value;ownLookup(false);}
  if(ev.target.id==='bt'){S.bt=ev.target.value;render();}
  if(ev.target.id==='rvt'){S.rvTopic=ev.target.value;startReview();render();}
  if(ev.target.dataset&&ev.target.dataset.ag){ensureDraft();S.dA[ev.target.dataset.ag]=Math.max(0,parseInt(ev.target.value,10)||0);render();}
  if(ev.target.dataset&&ev.target.dataset.tg){ensureDraft();S.dT[ev.target.dataset.tg]=Math.max(0,parseInt(ev.target.value,10)||0);render();}
  if(ev.target.id==='picfile'){const f=ev.target.files[0];if(!f)return;
    if(REMOTE){S.msg='Uploading picture…';render();shrinkImage(f).then(data=>apiPost({action:'picture',name:f.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:data,lateDay:S.cat==='Analyze Data'?(S.lateDay||''):''})).then(r=>{S.msg=r.error||'Picture uploaded. Both of you see the same one.';render()}).catch(err=>{S.msg=err.message;render()});return;}
    const rd=new FileReader();rd.onload=()=>{promptRow(S.lateDay||TODAYS).v.pic={src:rd.result,name:f.name};S.msg='Picture uploaded. Both of you see the same one.';render();};rd.readAsDataURL(f);}
});
document.addEventListener('input',ev=>{const d=ev.target.dataset&&ev.target.dataset.dr;if(d){S.dr=S.dr||{};S.dr[d]=ev.target.value;if(S.ai&&S.ai.where==='dr:'+d&&!S.ai.loading)S.ai=null;}});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.mf;if(k){S.mf=S.mf||{};S.mf[k]=ev.target.value}});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='rvq'&&ev.key==='Enter'){ev.preventDefault();const b=document.querySelector('[data-a=rv_check]');if(b)b.click();return}
  if(ev.target.id==='bq'&&ev.key==='Enter'){S.bq=ev.target.value;render();return}
  if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('pickrow')){ev.preventDefault();ev.target.click();return}
  if(ev.target.id==='lq'&&ev.key==='Enter'){S.lq=ev.target.value;render();const el=document.getElementById('lq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}return}
  if(S.screen==='review'&&(S.prTab==='duel'?(S.duel&&!S.duel.done&&S.duel.picked===null):(S.rvMode!=='word'&&S.rv&&!S.rv.reveal))&&!/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)){
    const i={a:0,b:1,c:2,'1':0,'2':1,'3':2}[String(ev.key).toLowerCase()];
    const btn=i===undefined?null:document.querySelectorAll('button.opt')[i];
    if(btn){ev.preventDefault();btn.click()}
  }
});
// Reload after midnight (so "today" is right) and sign out when the 1-hour Google sign-in runs out
function dayAndSessionCheck(){
  const typing=S.screen==='input'&&Object.values(S.f||{}).some(x=>String(x||'').trim());
  if(ds(new Date())!==TODAYS&&!typing){location.reload();return}
  if(S.started&&ID_TOKEN&&jwtExp(ID_TOKEN)<Date.now())sessionExpired();
}
setInterval(dayAndSessionCheck,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayAndSessionCheck()});
if(!handleRedirect())restoreSession();
let lastY=0;
window.addEventListener('scroll',()=>{const y=window.scrollY,tb=document.getElementById('tabs');if(!tb)return;if(y>lastY+10)tb.classList.add('hide');else if(y<lastY-10)tb.classList.remove('hide');lastY=y},{passive:true});
render();
</script>
</body></html>
